<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photos</title>
    <style>
        body { font-family: -apple-system, sans-serif; background:#111; color:#eee; margin:0; padding:16px; }
        button { background:#0a84ff; color:#fff; border:none; padding:10px 16px; border-radius:8px; font-size:16px; }
        button:disabled { background:#555; }
        input[type=text] { padding:8px; border-radius:6px; border:none; }
        a { color:#0a84ff; }
        .albums { display:grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap:12px; margin-top:16px; }
        .album { display:block; text-decoration:none; color:inherit; }
        .album img { width:100%; height:120px; object-fit:cover; border-radius:6px; background:#333; }
        .album-name { font-size:14px; margin-top:4px; }
        #progress-wrap { display:none; background:#333; border-radius:8px; margin-top:12px; overflow:hidden; }
        #progress-bar { height:20px; width:0%; background:#0a84ff; text-align:center; color:#fff; font-size:12px; line-height:20px; }
        #status { margin-top:8px; }
    </style>
</head>
<body>
    <h1>📸 My Photos</h1>
    <p>{{ storage.used_gb }} GB used of {{ storage.total_gb }} GB ({{ storage.percent }}%)</p>

    <form id="upload-form" enctype="multipart/form-data">
        <input type="text" id="folder-input" name="folder" placeholder="Album name (optional, defaults to today)"><br><br>
        <input type="file" id="file-input" name="files" multiple accept="image/*,.cr2,.cr3,.nef,.arw,.dng,.raf,.orf,.rw2" required><br><br>
        <button type="submit" id="upload-btn">Upload</button>
    </form>
    <div id="progress-wrap"><div id="progress-bar">0%</div></div>
    <div id="status"></div>

    <div class="albums">
        {% for album in folders %}
          <a class="album" href="/folder/{{ album.name }}">
            {% if album.cover %}
              <img src="/thumbnails/{{ album.cover }}" loading="lazy">
            {% else %}
              <img src="">
            {% endif %}
            <div class="album-name">{{ album.name }} ({{ album.count }})</div>
          </a>
        {% endfor %}
    </div>

    <script>
        const form = document.getElementById('upload-form');
        const fileInput = document.getElementById('file-input');
        const folderInput = document.getElementById('folder-input');
        const uploadBtn = document.getElementById('upload-btn');
        const progressWrap = document.getElementById('progress-wrap');
        const progressBar = document.getElementById('progress-bar');
        const status = document.getElementById('status');

        const MAX_RETRIES = 3;
        const RETRY_DELAY_MS = 2000;

        async function sha256Hex(file) {
            const buffer = await file.arrayBuffer();
            const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function uploadOneFile(file, hash, folder) {
            return new Promise((resolve) => {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('file_hash', hash);
                formData.append('folder', folder);

                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/upload');

                xhr.upload.addEventListener('progress', function (event) {
                    if (event.lengthComputable) {
                        const percent = Math.round((event.loaded / event.total) * 100);
                        progressBar.style.width = percent + '%';
                        progressBar.textContent = percent + '%';
                    }
                });

                xhr.onload = function () {
                    if (xhr.status === 200) resolve(JSON.parse(xhr.responseText));
                    else resolve({ status: 'error' });
                };
                xhr.onerror = function () { resolve({ status: 'error' }); };
                xhr.send(formData);
            });
        }

        async function uploadWithRetries(file, hash, folder, index, total) {
            for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
                status.textContent = `File ${index + 1}/${total}: ${file.name}` + (attempt > 1 ? ` (retry ${attempt - 1})` : '');
                const result = await uploadOneFile(file, hash, folder);
                if (result.status === 'ok') return result.folder;
                if (attempt < MAX_RETRIES) {
                    status.textContent = `${file.name} failed — retrying in ${RETRY_DELAY_MS / 1000}s...`;
                    await new Promise(r => setTimeout(r, RETRY_DELAY_MS));
                }
            }
            return null;
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            const filesArray = Array.from(fileInput.files);
            const folder = folderInput.value;
            uploadBtn.disabled = true;
            progressWrap.style.display = 'block';

            const failed = [];
            let landedFolder = null;

            for (let i = 0; i < filesArray.length; i++) {
                const file = filesArray[i];
                progressBar.style.width = '0%';
                progressBar.textContent = '0%';
                status.textContent = `Verifying file ${i + 1}/${filesArray.length}: ${file.name}...`;
                const hash = await sha256Hex(file);
                const resultFolder = await uploadWithRetries(file, hash, folder, i, filesArray.length);
                if (resultFolder) landedFolder = resultFolder;
                else failed.push(file.name);
            }

            uploadBtn.disabled = false;
            if (failed.length === 0 && landedFolder) {
                status.textContent = `All ${filesArray.length} file(s) uploaded. Opening album...`;
                setTimeout(() => location.href = `/folder/${landedFolder}`, 800);
            } else {
                status.textContent = `${failed.length} file(s) failed after ${MAX_RETRIES} attempts: ${failed.join(', ')}.`;
            }
        });
    </script>
</body>
</html>
