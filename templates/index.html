<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photos</title>
    <style>
        body { font-family: -apple-system, sans-serif; background:#111; color:#eee; margin:0; padding:16px; }
        button { background:#0a84ff; color:#fff; border:none; padding:10px 16px; border-radius:8px; font-size:16px; }
        button:disabled { background:#555; }
        .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap:8px; margin-top:16px; }
        .grid img, .grid video { width:100%; height:120px; object-fit:cover; border-radius:6px; }
        #progress-wrap { display:none; background:#333; border-radius:8px; margin-top:12px; overflow:hidden; }
        #progress-bar { height:20px; width:0%; background:#0a84ff; text-align:center; color:#fff; font-size:12px; line-height:20px; }
        #status { margin-top:8px; }
    </style>
</head>
<body>
    <h1>📸 My Photos</h1>
    <form id="upload-form" enctype="multipart/form-data">
        <input type="file" id="file-input" name="files" multiple accept="image/*,.cr2,.cr3,.nef,.arw,.dng,.raf,.orf,.rw2" required><br><br>
        <button type="submit" id="upload-btn">Upload</button>
    </form>
    <div id="progress-wrap">
        <div id="progress-bar">0%</div>
    </div>
    <div id="status"></div>

    <div class="grid">
        {% for f in files %}
          <div>
            {% if f.lower().endswith(('.mp4', '.mov')) %}
              <video src="/files/{{ f }}" controls></video>
            {% elif f.lower().endswith(('.cr2', '.cr3', '.nef', '.arw', '.dng', '.raf', '.orf', '.rw2')) %}
              <a href="/files/{{ f }}">{{ f }}</a>
            {% else %}
              <img src="/files/{{ f }}" loading="lazy">
            {% endif %}
            <form action="/delete" method="post" onsubmit="return confirm('Delete {{ f }}?')">
              <input type="hidden" name="filename" value="{{ f }}">
              <button type="submit">Delete</button>
            </form>
          </div>
        {% endfor %}
    </div>
        <script>
        const form = document.getElementById('upload-form');
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('upload-btn');
        const progressWrap = document.getElementById('progress-wrap');
        const progressBar = document.getElementById('progress-bar');
        const status = document.getElementById('status');

        async function sha256Hex(file) {
            const buffer = await file.arrayBuffer();
            const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
            return Array.from(new Uint8Array(hashBuffer))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const filesArray = Array.from(fileInput.files);
            uploadBtn.disabled = true;
            progressWrap.style.display = 'block';
            progressBar.style.width = '0%';
            progressBar.textContent = '0%';
            status.textContent = `Verifying ${filesArray.length} file(s)...`;

            const formData = new FormData();
            for (const file of filesArray) {
                const hash = await sha256Hex(file);
                formData.append('files', file);
                formData.append('hashes', hash);
            }

            status.textContent = `Uploading ${filesArray.length} file(s)...`;

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/upload');

            xhr.upload.addEventListener('progress', function (event) {
                if (event.lengthComputable) {
                    const percent = Math.round((event.loaded / event.total) * 100);
                    progressBar.style.width = percent + '%';
                    progressBar.textContent = percent + '%';
                    if (percent === 100) {
                        status.textContent = 'Verifying on server...';
                    }
                }
            });

            xhr.onload = function () {
                uploadBtn.disabled = false;
                if (xhr.status === 200) {
                    const data = JSON.parse(xhr.responseText);
                    const failed = data.results.filter(r => r.status === 'failed');
                    if (failed.length === 0) {
                        status.textContent = `All ${data.results.length} file(s) verified and saved. Refreshing...`;
                        setTimeout(() => location.reload(), 800);
                    } else {
                        status.textContent = `${failed.length} file(s) failed verification: ${failed.map(f => f.filename).join(', ')}. Please retry these.`;
                    }
                } else {
                    status.textContent = `Upload failed (status ${xhr.status})`;
                }
            };

            xhr.onerror = function () {
                status.textContent = 'Upload failed — check your connection.';
                uploadBtn.disabled = false;
            };

            xhr.send(formData);
        });
    </script>
</body>
</html>
