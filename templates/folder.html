<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ folder }}</title>
    <style>
        body { font-family: -apple-system, sans-serif; background:#111; color:#eee; margin:0; padding:16px; }
        button { background:#0a84ff; color:#fff; border:none; padding:10px 16px; border-radius:8px; font-size:16px; }
        button:disabled { background:#555; }
        a { color:#0a84ff; }
        select { padding:6px; border-radius:6px; }
        .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap:8px; margin-top:16px; }
        .grid img, .grid video { width:100%; height:120px; object-fit:cover; border-radius:6px; }
        #progress-wrap { display:none; background:#333; border-radius:8px; margin-top:12px; overflow:hidden; }
        #progress-bar { height:20px; width:0%; background:#0a84ff; text-align:center; color:#fff; font-size:12px; line-height:20px; }
        #status { margin-top:8px; }
    </style>
</head>
<body>
    <a href="/">← All Albums</a>
    <h1>{{ folder }}</h1>

    <form method="get">
        Sort:
        <select name="sort" onchange="this.form.submit()">
            <option value="date" {% if sort == "date" %}selected{% endif %}>Newest first</option>
            <option value="name" {% if sort == "name" %}selected{% endif %}>Name</option>
        </select>
        Filter:
        <select name="type" onchange="this.form.submit()">
            <option value="all" {% if type == "all" %}selected{% endif %}>All</option>
            <option value="image" {% if type == "image" %}selected{% endif %}>Photos only</option>
            <option value="raw" {% if type == "raw" %}selected{% endif %}>RAW only</option>
        </select>
    </form>

    <form id="upload-form" enctype="multipart/form-data">
        <input type="hidden" id="folder-value" value="{{ folder }}">
        <input type="file" id="file-input" name="files" multiple accept="image/*,.cr2,.cr3,.nef,.arw,.dng,.raf,.orf,.rw2" required><br><br>
        <button type="submit" id="upload-btn">Upload to this album</button>
    </form>
    <div id="progress-wrap"><div id="progress-bar">0%</div></div>
    <div id="status"></div>

    <div class="grid">
        {% for f in files %}
          <div>
            {% if f.lower().endswith(('.cr2', '.cr3', '.nef', '.arw', '.dng', '.raf', '.orf', '.rw2')) %}
              <a href="/files/{{ folder }}/{{ f }}">{{ f }}</a>
            {% elif f in thumbs %}
              <a href="/files/{{ folder }}/{{ f }}"><img src="/thumbnails/{{ folder }}/{{ f }}" loading="lazy"></a>
            {% else %}
              <img src="/files/{{ folder }}/{{ f }}" loading="lazy">
            {% endif %}
            <form action="/delete" method="post" onsubmit="return confirm('Delete {{ f }}?')">
              <input type="hidden" name="filename" value="{{ f }}">
              <input type="hidden" name="folder" value="{{ folder }}">
              <button type="submit">Delete</button>
            </form>
          </div>
        {% endfor %}
    </div>

    <script>
        const form = document.getElementById('upload-form');
        const fileInput = document.getElementById('file-input');
        const folderValue = document.getElementById('folder-value').value;
        const uploadBtn = document.getElementById('upload-btn');
        const progressWrap = document.getElementById('progress-wrap');
        const progressBar = document.getElementById('progress-bar');
        const status = document.getElementById('status');

        const MAX_RETRIES = 3;
        const RETRY_DELAY_MS = 2000;

        async function sha256Hex(file) {
            const buffer = await file.arrayBuffer();
            const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function uploadOneFile(file, hash) {
            return new Promise((resolve) => {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('file_hash', hash);
                formData.append('folder', folderValue);

                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/upload');

                xhr.upload.addEventListener('progress', function (event) {
                    if (event.lengthComputable) {
                        const percent = Math.round((event.loaded / event.total) * 100);
                        progressBar.style.width = percent + '%';
                        progressBar.textContent = percent + '%';
                    }
                });

                xhr.onload = function () {
                    if (xhr.status === 200) resolve(JSON.parse(xhr.responseText).status);
                    else resolve('error');
                };
                xhr.onerror = function () { resolve('error'); };
                xhr.send(formData);
            });
        }
